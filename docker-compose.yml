version: '3.8'

services:
  mysql_db:
    image: mysql:8.0
    container_name: sanota_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DATABASE_PASSWORD}
      MYSQL_DATABASE: ${DATABASE_NAME}
      MYSQL_USER: ${DATABASE_USERNAME}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - sanota_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sanota_backend
    restart: always
    depends_on:
      - mysql_db
    env_file:
      - .env.production
    environment:
      DATABASE_CLIENT: mysql
      DATABASE_HOST: mysql_db
      DATABASE_PORT: 3306
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_USERNAME: ${DATABASE_USERNAME}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - backend_uploads:/opt/app/public/uploads
    ports:
      - "1337:1337"
    networks:
      - sanota_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sanota_frontend
    restart: always
    depends_on:
      - backend
    env_file:
      - .env.production
    ports:
      - "3000:3000"
    networks:
      - sanota_network

  nginx:
    image: nginx:alpine
    container_name: sanota_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - sanota_network

volumes:
  mysql_data:
  backend_uploads:

networks:
  sanota_network:
    driver: bridge
