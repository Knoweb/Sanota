server {
    listen 80;
    server_name _;

    # Proxy to Showcase / Conference App (from QR code)
    location = /qr {
        return 301 /qr/;
    }

    location /qr/ {
        proxy_pass http://168.144.141.102/;
        proxy_http_version 1.1;
        proxy_set_header Host 168.144.141.102;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy Vite static assets for the showcase app (/assets/*)
    location /assets/ {
        proxy_pass http://168.144.141.102/assets/;
        proxy_http_version 1.1;
        proxy_set_header Host 168.144.141.102;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy to Frontend (Next.js)
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Proxy to Backend (Strapi core routes)
    location ~ ^/(admin|api|content-manager|content-type-builder|upload|uploads|users-permissions|i18n)(/.*)?$ {
        proxy_pass http://backend:1337;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
